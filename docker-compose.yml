services:
  vizio-control:
    build: .
    container_name: vizio-control
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - VIZIO_HOST=0.0.0.0
      - VIZIO_PORT=8080
      - VIZIO_CONFIG_FILE=/app/data/config.json
    # For local network access to TVs
    network_mode: host
